<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poultry Manager — Design System · Clay Morphism</title>
<link href="./design_files/css2" rel="stylesheet">
<style>
  :root {
    /* Core palette */
    --clay-bg:        #F8F2EA;
    --clay-surface:   #F0E4D2;
    --clay-surface-2: #E6D4BC;
    --clay-border:    #D8BFA6;
    --clay-border-2:  #C9A888;

    /* Brand */
    --terra-50:   #FDF1EC;
    --terra-100:  #F9D9CC;
    --terra-200:  #F3B89F;
    --terra-400:  #D4856A;
    --terra-600:  #B5614A;
    --terra-800:  #7A3A28;
    --terra-900:  #4F2118;

    /* Sand */
    --sand-100:   #F8EDD8;
    --sand-200:   #F0D9B5;
    --sand-400:   #E0B88A;
    --sand-600:   #C49660;
    --sand-800:   #8A6030;

    /* Text */
    --text-primary:   #5C3D2E;
    --text-secondary: #9C7B6E;
    --text-tertiary:  #C4A898;

    /* Semantic */
    --success-bg:   #EFF6EE;
    --success-text: #3A6B35;
    --success-dot:  #5A9E52;
    --warning-bg:   #FBF3E6;
    --warning-text: #8A5A1A;
    --warning-dot:  #D4900A;
    --danger-bg:    #FAF0EE;
    --danger-text:  #8A3828;
    --danger-dot:   #C45040;

    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font); font-size: 15px; color: var(--text-primary);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    background-color: var(--clay-bg);
  }

  .page { max-width: 1080px; margin: 0 auto; padding: 64px 40px 120px; }
  .section { margin-bottom: 88px; }

  .section-header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 16px; margin-bottom: 40px;
    border-bottom: 1.5px solid var(--clay-border);
  }
  .section-num-wrap {
    background: var(--terra-400);
    border: 1.5px solid var(--terra-600);
    border-radius: var(--radius-sm);
    padding: 5px 11px;
  }
  .section-num { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: white; }
  .section-title { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }

  /* ─── HEADER ─────────────────────────────── */
  .doc-header {
    background: var(--clay-surface);
    border: 1.5px solid var(--clay-border-2);
    border-radius: var(--radius-lg);
    padding: 44px 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap;
    margin-bottom: 80px;
  }
  .doc-logo-row { display: flex; align-items: center; gap: 16px; }
  .doc-icon {
    width: 64px; height: 64px;
    background: var(--terra-400);
    border: 1.5px solid var(--terra-600);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .doc-icon-text { font-size: 26px; }
  .doc-wordmark { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }
  .doc-wordmark span { color: var(--terra-400); }
  .doc-tagline { font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-secondary); margin-top: 4px; }
  .doc-meta { display: flex; flex-direction: column; gap: 10px; text-align: right; }
  .doc-meta-item {
    background: var(--clay-bg);
    border: 1.5px solid var(--clay-border);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
  }
  .doc-meta-key { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-tertiary); }
  .doc-meta-val { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }

  /* ─── COLOUR ─────────────────────────────── */
  .ramp { display: flex; border-radius: var(--radius-md); overflow: hidden; border: 1.5px solid var(--clay-border-2); margin-bottom: 10px; }
  .ramp-stop { flex: 1; padding: 14px 8px 9px; display: flex; flex-direction: column; justify-content: flex-end; }
  .ramp-stop-name { font-size: 9px; font-weight: 700; opacity: 0.65; }
  .ramp-stop-hex  { font-size: 8px; font-family: var(--mono); opacity: 0.55; margin-top: 1px; }
  .ramp-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; }

  .semantic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
  .semantic-card {
    background: var(--clay-surface);
    border: 1.5px solid var(--clay-border);
    border-radius: var(--radius-md);
    padding: 18px;
  }
  .semantic-swatch { width: 32px; height: 32px; border-radius: var(--radius-sm); margin-bottom: 10px; border: 1.5px solid var(--clay-border-2); }
  .semantic-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .semantic-hex  { font-size: 10px; font-family: var(--mono); margin-top: 3px; opacity: 0.7; }
  .semantic-use  { font-size: 11px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--clay-border); line-height: 1.4; color: var(--text-secondary); }

  /* ─── TYPOGRAPHY ─────────────────────────── */
  .font-showcase {
    background: var(--clay-surface);
    border: 1.5px solid var(--clay-border);
    border-radius: var(--radius-lg);
    padding: 36px; margin-bottom: 24px;
  }
  .font-showcase-name { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--terra-400); margin-bottom: 20px; }
  .font-weight-row { display: flex; align-items: baseline; gap: 20px; margin-bottom: 10px; }
  .font-weight-label { font-size: 10px; font-family: var(--mono); color: var(--text-tertiary); width: 80px; flex-shrink: 0; }

  .type-table {
    border-radius: var(--radius-lg); overflow: hidden;
    border: 1.5px solid var(--clay-border);
    background: var(--clay-surface);
  }
  .type-row { display: grid; grid-template-columns: 150px 140px 1fr; align-items: center; padding: 18px 26px; gap: 20px; border-bottom: 1px solid var(--clay-border); }
  .type-row:last-child { border-bottom: none; }
  .type-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--terra-400); }
  .type-spec  { font-size: 10px; font-family: var(--mono); color: var(--text-tertiary); line-height: 1.6; }

  /* ─── SPACING ────────────────────────────── */
  .spacing-table {
    border-radius: var(--radius-lg); overflow: hidden;
    border: 1.5px solid var(--clay-border);
    background: var(--clay-surface);
  }
  .spacing-row { display: flex; align-items: center; gap: 20px; padding: 12px 26px; border-bottom: 1px solid var(--clay-border); }
  .spacing-row:last-child { border-bottom: none; }
  .spacing-token { font-size: 12px; font-family: var(--mono); color: var(--text-primary); width: 100px; flex-shrink: 0; }
  .spacing-px    { font-size: 11px; color: var(--text-secondary); width: 50px; flex-shrink: 0; }
  .spacing-use   { font-size: 11px; color: var(--text-secondary); }
  .spacing-bar   { height: 18px; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--terra-400); border: 1.5px solid var(--terra-600); }

  /* ─── COMPONENTS ─────────────────────────── */
  .comp-section { margin-bottom: 40px; }
  .comp-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--terra-400); margin-bottom: 14px; }
  .comp-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* Buttons */
  .btn {
    font-family: var(--font); font-weight: 600; font-size: 13px; cursor: pointer;
    border-radius: var(--radius-sm); padding: 10px 20px;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background 0.1s;
    letter-spacing: -0.1px;
    background: var(--clay-surface);
    color: var(--text-primary);
    border: 1.5px solid var(--clay-border-2);
  }
  .btn:active { background: var(--clay-surface-2); }

  .btn-primary {
    background: var(--terra-400); color: white;
    border: 1.5px solid var(--terra-600);
  }
  .btn-primary:active { background: var(--terra-600); }

  .btn-secondary {
    background: var(--sand-400); color: white;
    border: 1.5px solid var(--sand-600);
  }
  .btn-secondary:active { background: var(--sand-600); }

  .btn-ghost {
    background: transparent; color: var(--text-secondary);
    border: 1.5px solid var(--clay-border);
  }
  .btn-danger {
    background: var(--danger-bg); color: var(--danger-text);
    border: 1.5px solid #D4A09A;
  }
  .btn-danger:active { background: #F0D8D4; }

  .btn-sm { padding: 7px 14px; font-size: 12px; }
  .btn-lg { padding: 14px 28px; font-size: 15px; }

  /* Badges */
  .badge {
    font-family: var(--font); font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: var(--radius-sm);
    display: inline-block; letter-spacing: 0.2px;
    border: 1.5px solid;
  }
  .badge-terra   { background: var(--terra-50); color: var(--terra-800); border-color: var(--terra-200); }
  .badge-success { background: var(--success-bg); color: var(--success-text); border-color: #B8D9B4; }
  .badge-warning { background: var(--warning-bg); color: var(--warning-text); border-color: #E8C88A; }
  .badge-danger  { background: var(--danger-bg);  color: var(--danger-text);  border-color: #E4B8B4; }
  .badge-neutral { background: var(--clay-surface); color: var(--text-secondary); border-color: var(--clay-border); }

  /* Cards */
  .card {
    background: var(--clay-surface);
    border: 1.5px solid var(--clay-border);
    border-radius: var(--radius-lg);
    padding: 22px;
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; letter-spacing: -0.2px; }
  .card-body  { font-size: 13px; line-height: 1.6; color: var(--text-secondary); }

  .card-accent {
    background: var(--terra-50);
    border: 1.5px solid var(--terra-200);
    border-radius: var(--radius-lg);
    padding: 22px;
  }
  .card-dark {
    background: var(--text-primary);
    border: 1.5px solid var(--terra-900);
    border-radius: var(--radius-lg);
    padding: 22px;
  }

  /* Input */
  .input {
    font-family: var(--font); font-size: 14px; padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--clay-border-2);
    background: var(--clay-bg);
    color: var(--text-primary);
    outline: none; width: 100%;
    transition: border-color 0.15s;
  }
  .input:focus { border-color: var(--terra-400); }
  .input::placeholder { color: var(--text-tertiary); }
  .input-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

  /* Stat cards */
  .stat-card {
    background: var(--clay-surface);
    border: 1.5px solid var(--clay-border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    flex: 1; min-width: 130px;
  }
  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-tertiary); margin-bottom: 5px; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--text-primary); line-height: 1; }
  .stat-sub   { font-size: 12px; color: var(--text-tertiary); margin-top: 5px; }
  .stat-up    { color: var(--success-text); font-weight: 600; }
  .stat-down  { color: var(--danger-text); font-weight: 600; }

  /* Status dots */
  .status { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.1); }

  /* Progress */
  .progress-track {
    height: 14px; background: var(--clay-surface-2);
    border: 1.5px solid var(--clay-border-2);
    border-radius: var(--radius-sm);
    overflow: hidden; padding: 2px;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    background: var(--terra-400);
    border: 1px solid var(--terra-600);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .mt-sm  { margin-top: 12px; }
</style>
